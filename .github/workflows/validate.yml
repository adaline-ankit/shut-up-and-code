name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural validation
        run: python3 scripts/validate.py
      - name: slopcheck tests
        run: python3 scripts/test_slopcheck.py
      - name: slopcheck passes its own rules
        run: python3 scripts/slopcheck.py scripts/ hooks/
